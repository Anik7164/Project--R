# Builds the Windows setup file (dist\ProjectR-Setup.exe) the same way
# installer\build.ps1 does on a PC, then installs it on a clean Windows
# machine and checks that the app starts. Download it from the run's
# "Artifacts". Run it by hand: Actions > Windows setup file > Run workflow.
name: Windows setup file

on:
  workflow_dispatch:
    inputs:
      offline:
        description: "Also build the offline setup (everything inside, about 3 GB)"
        type: boolean
        default: true
  push:
    paths:
      - "installer/**"
      - "requirements.txt"
      - ".github/workflows/windows-setup.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the setup file
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -Version "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectR-Setup
          path: dist/ProjectR-Setup.exe
          retention-days: 30

  test-install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjectR-Setup
      - name: Install silently into D:\ProjectR (as a friend would, minus the clicks)
        shell: pwsh
        run: |
          $p = Start-Process .\ProjectR-Setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=D:\ProjectR", "/LOG=D:\install.log"
          Get-Content D:\ProjectR\setup.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          if (-not (Test-Path D:\ProjectR\.venv\Scripts\project-r-ready.txt)) { throw "Python set-up did not finish" }
      - name: The app's server starts and loads the models
        shell: pwsh
        working-directory: D:\ProjectR
        run: |
          .venv\Scripts\python.exe desktop\app.py --check
          $env:PYTHONUNBUFFERED = "1"   # the log shows each line as it comes
          $server = Start-Process .venv\Scripts\python.exe -ArgumentList "webapp\server.py", "--port", "8000" -PassThru -RedirectStandardOutput D:\server.log -RedirectStandardError D:\server.err
          $ok = $false
          # A cold CPU-only runner takes several minutes to load PyTorch and the models.
          foreach ($i in 1..300) {
            Start-Sleep 3
            $text = (Get-Content D:\server.log, D:\server.err -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($text -match "models ready") { $ok = $true; break }
            if ($text -match "could not load the models") { break }
          }
          Get-Content D:\server.log, D:\server.err -ErrorAction SilentlyContinue | Select-Object -Last 30
          $state = Invoke-RestMethod http://127.0.0.1:8000/api/state
          Write-Host "operator: $($state.operator)"
          Stop-Process $server.Id -Force
          if (-not $ok) { throw "the models did not load" }
      - name: Uninstall keeps nothing but the user's videos and matches
        shell: pwsh
        run: |
          $p = Start-Process D:\ProjectR\unins000.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Start-Sleep 5
          Get-ChildItem D:\ProjectR -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          if (Test-Path D:\ProjectR\.venv) { throw ".venv left behind" }

  offline:
    if: github.event_name == 'workflow_dispatch' && inputs.offline
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline setup (Python, PyTorch with CUDA and the voice inside)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -Offline -Version "1.0.${{ github.run_number }}"
      - name: Install it and check it works with no internet
        shell: pwsh
        run: |
          $p = Start-Process dist\ProjectR-Offline\ProjectR-Setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=C:\Program Files\Project R"
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          # "For all users" into Program Files: every user must be able to write there.
          $acl = (Get-Acl "C:\Program Files\Project R").Access | Where-Object { $_.IdentityReference -match "Users" -and $_.FileSystemRights -match "Modify" }
          if (-not $acl) { throw "Users cannot write into C:\Program Files\Project R" }
          $env:HTTPS_PROXY = $env:HTTP_PROXY = "http://127.0.0.1:9"   # no internet for the check
          $env:HF_HUB_OFFLINE = "1"
          Set-Location "C:\Program Files\Project R"
          runtime\python.exe desktop\app.py --check
          if ($LASTEXITCODE -ne 0) { throw "check failed" }
          runtime\python.exe -c "import sys; sys.path.insert(0, 'src'); import project_cache; from transformers import VitsModel; VitsModel.from_pretrained('facebook/mms-tts-ben'); import torch, ultralytics; print('offline OK, torch', torch.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "offline import failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectR-Offline
          path: dist/ProjectR-Offline/
          retention-days: 14
          compression-level: 0
