
tracker_type: botsort

# Detection association thresholds
track_high_thresh: 0.35
track_low_thresh: 0.10
new_track_thresh: 0.40

# Retain lost tracks for up to 60 frames
track_buffer: 90

# Matching threshold
match_thresh: 0.80
fuse_score: true

# Camera-motion compensation
gmc_method: sparseOptFlow

# BoT-SORT appearance/ReID settings
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: false
model: auto
