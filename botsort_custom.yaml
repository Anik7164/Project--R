
tracker_type: botsort

# Detection association thresholds. With the football detector, boxes
# under ~0.5 are often a second box on a player, a steward or a half-seen
# player; starting tracks on them split one player into many short tracks
# (half of all tracks lasted under 8 frames on the local-match video).
# They are still used to continue existing tracks (track_low_thresh).
# 0.35/0.40 -> 0.50/0.60: 20 s of the local match 148 -> 88 tracker IDs,
# 70 -> 61 player IDs, 3% fewer boxes; a TV clip 65 -> 41 tracker IDs.
track_high_thresh: 0.50
track_low_thresh: 0.10
new_track_thresh: 0.60

# Retain lost tracks for up to 90 frames (3 s at 30 fps). Longer gaps
# are bridged by the identity layer in src/identity.py.
track_buffer: 90

# Matching threshold
match_thresh: 0.80
fuse_score: true

# Camera-motion compensation
gmc_method: sparseOptFlow

# BoT-SORT appearance/ReID settings
proximity_thresh: 0.50
appearance_thresh: 0.80
# Off by default. YOLO26 is NMS-free, so `model: auto` cannot reuse its
# features and Ultralytics downloads a generic ImageNet classifier
# (yolo26n-cls.pt) instead. Turn this on once a football ReID model
# (e.g. trained on SoccerNet-ReID) is available and set `model` to it.
with_reid: false
model: auto
